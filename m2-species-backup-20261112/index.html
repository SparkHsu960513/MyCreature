<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>M2 - 八爪共生母體 (Zone 3 // Specimen Monitor)</title>
    <style>
      :root {
        --bg-panel: rgba(12, 14, 18, 0.76);
        --border-subtle: rgba(255, 255, 255, 0.08);
        --border-focus: rgba(245, 158, 11, 0.4);
        --text-primary: #f4f4f5;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --accent-amber: #f59e0b;
        --accent-cyan: #38bdf8;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        background-color: #08090c;
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-font-smoothing: antialiased;
      }

      main {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      #world-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 1;
      }

      /* 精緻微型 HUD 狀態標籤（高質感觀測儀） */
      #hud {
        position: absolute;
        top: 18px;
        left: 18px;
        width: 250px;
        background: var(--bg-panel);
        padding: 14px 16px;
        border-radius: 10px;
        border: 1px solid var(--border-subtle);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
        pointer-events: none;
        z-index: 10;
        transition: opacity 0.3s ease;
      }

      .hud-eyebrow {
        font-size: 9.5px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-muted);
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
      }

      .hud-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent-amber);
        box-shadow: 0 0 8px rgba(245, 158, 11, 0.8);
        display: inline-block;
      }

      #hud h1 {
        margin: 0 0 10px 0;
        font-size: 13.5px;
        font-weight: 600;
        color: var(--text-primary);
        letter-spacing: 0.04em;
      }

      .hud-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11.5px;
        margin: 4px 0;
        color: var(--text-secondary);
      }

      .status-tag {
        font-size: 11px;
        color: var(--accent-cyan);
        background: rgba(56, 189, 248, 0.08);
        border: 1px solid rgba(56, 189, 248, 0.2);
        padding: 1px 7px;
        border-radius: 4px;
        font-weight: 500;
      }

      .exp-bar-container {
        width: 100%;
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 2px;
        margin: 6px 0 10px 0;
        overflow: hidden;
      }

      .exp-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #f59e0b, #fbbf24);
        width: 0%;
        transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .hud-instructions {
        font-size: 10px;
        color: var(--text-muted);
        line-height: 1.5;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        padding-top: 8px;
        margin-top: 8px;
      }

      .hud-instructions b {
        color: var(--text-secondary);
      }

      /* 側邊參數調控板（極簡黑曜玻璃） */
      #control-panel {
        position: absolute;
        top: 18px;
        right: 18px;
        width: 250px;
        background: var(--bg-panel);
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        padding: 16px 16px 14px 16px;
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
        z-index: 20;
        transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }

      #control-panel.collapsed {
        transform: translateX(290px);
      }

      #panel-toggle {
        position: absolute;
        left: -36px;
        top: 12px;
        width: 32px;
        height: 32px;
        background: var(--bg-panel);
        border: 1px solid var(--border-subtle);
        border-radius: 8px 0 0 8px;
        color: var(--text-secondary);
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        backdrop-filter: blur(16px);
        transition: all 0.2s ease;
      }

      #panel-toggle:hover {
        color: var(--text-primary);
        background: rgba(24, 28, 36, 0.95);
        border-color: var(--border-focus);
      }

      #control-panel h2 {
        margin: 0 0 12px 0;
        font-size: 11.5px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-secondary);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        padding-bottom: 8px;
      }

      .control-group {
        margin-bottom: 12px;
      }

      .control-group label {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--text-secondary);
        margin-bottom: 5px;
        font-weight: 500;
      }

      .control-group label span.val {
        color: var(--accent-amber);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10.5px;
      }

      .control-group input[type="range"] {
        width: 100%;
        height: 3px;
        accent-color: var(--accent-amber);
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        outline: none;
        cursor: pointer;
        transition: background 0.2s;
      }

      .control-group input[type="range"]:hover {
        background: rgba(255, 255, 255, 0.16);
      }

      .control-group select {
        width: 100%;
        background: rgba(20, 24, 32, 0.85);
        color: var(--text-primary);
        border: 1px solid var(--border-subtle);
        padding: 6px 8px;
        border-radius: 6px;
        font-size: 11.5px;
        outline: none;
        cursor: pointer;
        transition: border-color 0.2s;
      }

      .control-group select:focus {
        border-color: var(--border-focus);
      }

      .btn-row {
        margin-top: 14px;
        display: flex;
        gap: 8px;
      }

      .btn {
        background: var(--accent-amber);
        color: #09090b;
        font-weight: 600;
        border: none;
        padding: 7px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 11px;
        transition: all 0.2s ease;
        letter-spacing: 0.02em;
      }

      .btn:hover {
        background: #f5b02b;
        transform: translateY(-1px);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-secondary);
        border: 1px solid var(--border-subtle);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.09);
        color: var(--text-primary);
        border-color: rgba(255, 255, 255, 0.16);
      }
    </style>
  </head>
  <body oncontextmenu="return false;">
    <!-- 左上角精緻微型 HUD 狀態標籤 -->
    <div id="hud">
      <div class="hud-eyebrow">
        <span class="hud-dot"></span>
        Zone 3 // Specimen Monitor
      </div>
      <h1>八爪機械共生體</h1>
      
      <div class="hud-row">
        <span>物種階段</span>
        <span id="player-tier" class="status-tag">Tier 3 巨獸 (5 爪)</span>
      </div>

      <div class="hud-row">
        <span>吞食同化</span>
        <span id="player-exp" style="color: var(--accent-amber); font-family: ui-monospace, monospace; font-size: 11px;">0 / 3</span>
      </div>
      
      <div class="exp-bar-container">
        <div id="exp-bar-fill" class="exp-bar-fill"></div>
      </div>

      <div class="hud-row">
        <span>族群個體數</span>
        <span id="creature-count" style="color: var(--accent-cyan); font-family: ui-monospace, monospace;">1</span>
      </div>

      <div class="hud-row">
        <span>當前氣候</span>
        <span id="hud-weather" style="color: var(--text-primary); font-size: 11px;">乾燥常態</span>
      </div>

      <div class="hud-instructions">
        <b>滑鼠左鍵</b>：引導母體爬行<br>
        <b>滑鼠右鍵</b>：投放低階幼體食物
      </div>
    </div>

    <!-- 右側黑曜玻璃調控面板 -->
    <div id="control-panel">
      <div id="panel-toggle" title="收合 / 展開面板">⚙</div>
      <h2>生態實驗艙控制</h2>

      <!-- 天氣選擇 -->
      <div class="control-group">
        <label for="weather-select">天候環境 (Weather)</label>
        <select id="weather-select">
          <option value="normal" selected>乾燥廢土 (Normal)</option>
          <option value="amber-rain">午後螢光橘雨 (Amber Rain)</option>
          <option value="freezing">夜間極凍死電 (Frozen Dark)</option>
        </select>
      </div>

      <!-- 環境明暗 -->
      <div class="control-group">
        <label for="bg-brightness">
          <span>環境明暗</span>
          <span id="val-brightness" class="val">18</span>
        </label>
        <input type="range" id="bg-brightness" min="6" max="50" value="18" />
      </div>

      <!-- 黏液黏稠度 -->
      <div class="control-group">
        <label for="slime-viscosity">
          <span>黏液流動性</span>
          <span id="val-viscosity" class="val">1.4</span>
        </label>
        <input type="range" id="slime-viscosity" min="0.5" max="3.0" step="0.1" value="1.4" />
      </div>

      <!-- 齒輪轉速 -->
      <div class="control-group">
        <label for="gear-speed">
          <span>齒輪活性</span>
          <span id="val-gear-speed" class="val">1.0</span>
        </label>
        <input type="range" id="gear-speed" min="0" max="3.0" step="0.2" value="1.0" />
      </div>

      <!-- 全域閃電頻率 -->
      <div class="control-group">
        <label for="lightning-frequency">
          <span>全域閃電</span>
          <span id="val-lightning" class="val">低頻</span>
        </label>
        <input type="range" id="lightning-frequency" min="0" max="3" step="1" value="1" />
      </div>

      <!-- 雨勢強度 -->
      <div class="control-group">
        <label for="rain-intensity">
          <span>雨勢強度</span>
          <span id="val-rain" class="val">大雨</span>
        </label>
        <input type="range" id="rain-intensity" min="0" max="4" step="1" value="2" />
      </div>

      <!-- 背景電力竄動頻率 -->
      <div class="control-group">
        <label for="electric-frequency">
          <span>殘存電力竄動</span>
          <span id="val-electric" class="val">低頻</span>
        </label>
        <input type="range" id="electric-frequency" min="0" max="3" step="1" value="1" />
      </div>

      <div class="btn-row">
        <button id="btn-spawn-random" class="btn" style="flex: 1;">散佈幼體</button>
        <button id="btn-reset" class="btn btn-secondary">重置母體</button>
      </div>
    </div>

    <main>
      <canvas id="world-canvas"></canvas>
    </main>
    <script type="module" src="sketch.js"></script>

    <script>
      const toggleBtn = document.getElementById('panel-toggle');
      const panel = document.getElementById('control-panel');
      toggleBtn.addEventListener('click', () => {
        panel.classList.toggle('collapsed');
      });
    </script>
  </body>
</html>
