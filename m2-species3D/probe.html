<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>probe</title>
    <style>
      html, body { margin: 0; height: 100%; background: #222; }
      #scene { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="fade"></div>
    <script>
      window.__errs = [];
      window.addEventListener('error', (e) => {
        window.__errs.push('ERROR: ' + (e.message || 'unknown') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0));
        document.title = window.__errs.join(' | ');
      });
      window.addEventListener('unhandledrejection', (e) => {
        window.__errs.push('REJECT: ' + (e.reason && (e.reason.message || e.reason)));
        document.title = window.__errs.join(' | ');
      });
    </script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
